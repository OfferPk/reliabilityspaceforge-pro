<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="920" height="480" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="50" y="65" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">ReliabilitySpaceForge Pro (v1.0.0) Architecture</text>
  <text x="50" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">ECSS-Q-ST-30C Rev. 1 &amp; ECSS-Q-ST-30-02C Spacecraft Dependability, RBD &amp; FMECA Pipeline</text>

  <!-- Section 1: Subsystem Failure Rates & Parts Derating -->
  <g transform="translate(50, 120)">
    <rect width="260" height="340" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="230" height="30" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="25" y="35" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">1. FAILURE RATES &amp; DERATING</text>

    <text x="20" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• MIL-HDBK-217F Notice 2 Models</text>
    <text x="20" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• FIT = 10⁻⁹ Failures / Hour</text>
    <text x="20" y="114" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Thermal &amp; Voltage Derating ≥ 50%</text>
    <text x="20" y="136" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Space Quality Factor π_Q Class S</text>
    <text x="20" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Exponential: R(t) = exp(-λt)</text>

    <rect x="20" y="180" width="220" height="60" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="30" y="202" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Subsystem Peak FIT:</text>
    <text x="30" y="222" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">Peak FIT: 850 ≤ 2,500 (PASS)</text>

    <rect x="20" y="250" width="220" height="60" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="30" y="272" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">System MTBF Margin:</text>
    <text x="30" y="292" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">MTBF = 30.8 yr (10.3× Life)</text>
  </g>

  <!-- Section 2: Reliability Block Diagram (RBD) Solver -->
  <g transform="translate(350, 120)">
    <rect width="260" height="340" rx="12" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="15" y="15" width="230" height="30" rx="6" fill="rgba(251, 191, 36, 0.15)"/>
    <text x="25" y="35" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">2. RBD REDUNDANCY SOLVER</text>

    <text x="20" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Series Chain: R_sys = ∏ R_i(t)</text>
    <text x="20" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Active Parallel: 1 - (1 - R)^n</text>
    <text x="20" y="114" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Cold Standby: exp(-λt)(1+P_sw·λt)</text>
    <text x="20" y="136" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 3-of-4 RW Pyramid: 4R³ - 3R⁴</text>
    <text x="20" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 2-of-3 Star Trackers: 3R² - 2R³</text>
    <text x="20" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Switchover Probability P_sw ≥ 0.98</text>

    <rect x="20" y="200" width="220" height="110" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="30" y="224" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">RBD End-of-Life Survival:</text>
    <text x="30" y="244" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Target R: ≥ 85.0%</text>
    <text x="30" y="264" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">Measured R(3yr): 90.12%</text>
    <text x="30" y="284" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">Margin: +5.12% (PASS)</text>
  </g>

  <!-- Section 3: FMECA Criticality & SPF Elimination -->
  <g transform="translate(650, 120)">
    <rect width="260" height="340" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="15" y="15" width="230" height="30" rx="6" fill="rgba(52, 211, 153, 0.15)"/>
    <text x="25" y="35" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">3. FMECA &amp; SPF AUDIT</text>

    <text x="20" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• ECSS-Q-ST-30-02C Matrix</text>
    <text x="20" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Severity: 1 (Catastrophic) to 4</text>
    <text x="20" y="114" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Probability: A (Remote) to E</text>
    <text x="20" y="136" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Single Point Failure (SPF) Scan</text>
    <text x="20" y="158" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Autonomous FDIR Coverage ≥ 95%</text>
    <text x="20" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• High-Risk Red Zone: 0 Items</text>

    <rect x="20" y="200" width="220" height="110" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="30" y="224" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">Normative Compliance:</text>
    <text x="30" y="244" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Single Point Failures: 0</text>
    <text x="30" y="264" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">FDIR Coverage: 96.0% (PASS)</text>
    <text x="30" y="284" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">ECSS Score: 10 / 10 PASS</text>
  </g>
</svg>
