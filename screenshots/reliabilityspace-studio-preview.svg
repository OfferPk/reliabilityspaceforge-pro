<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="#060b16"/>

  <!-- Top Navbar Preview -->
  <rect x="0" y="0" width="960" height="50" fill="#090e1c" stroke="#1e293b"/>
  <rect x="24" y="10" width="30" height="30" rx="6" fill="url(#headerGrad)"/>
  <text x="31" y="30" fill="#020617" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">REL</text>
  <text x="66" y="30" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">ReliabilitySpaceForge Pro v1.0.0</text>
  <rect x="330" y="14" width="180" height="22" rx="4" fill="rgba(14, 165, 233, 0.15)" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="340" y="29" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">ECSS-Q-ST-30C &amp; ECSS-Q-30-02</text>

  <!-- 5 KPI Cards -->
  <g transform="translate(24, 65)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="170" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="12" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">SYSTEM SURVIVAL R(t)</text>
    <text x="12" y="48" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">90.12%</text>
    <text x="12" y="65" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">Target ≥ 85.0% PASS</text>

    <!-- KPI 2 -->
    <rect x="185" y="0" width="170" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="197" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">SINGLE POINT FAILURES</text>
    <text x="197" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">0 SPFs</text>
    <text x="197" y="65" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">Full Redundancy</text>

    <!-- KPI 3 -->
    <rect x="370" y="0" width="170" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="382" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">SYSTEM MTBF</text>
    <text x="382" y="48" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">30.8 yr</text>
    <text x="382" y="65" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">10.3× Life Margin</text>

    <!-- KPI 4 -->
    <rect x="555" y="0" width="170" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="567" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">FMECA HIGH RISK</text>
    <text x="567" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">0 ITEMS</text>
    <text x="567" y="65" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">Zero Red Zone Hazards</text>

    <!-- KPI 5 -->
    <rect x="740" y="0" width="170" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="752" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">AUDIT SCORE</text>
    <text x="752" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">10 / 10 PASS</text>
    <text x="752" y="65" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">ECSS-Q-ST-30C CERTIFIED</text>
  </g>

  <!-- Main Grid Area -->
  <g transform="translate(24, 155)">
    <!-- Left Controls Panel -->
    <rect x="0" y="0" width="280" height="340" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">1. MISSION LIFETIME &amp; REDUNDANCY</text>
    <line x1="16" y1="36" x2="264" y2="36" stroke="#1e293b"/>

    <text x="16" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Mission Design Life: 3.0 yr</text>
    <text x="16" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Target R_target: 0.85 (85.0%)</text>
    <text x="16" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">FDIR Switchover Coverage: 96.0%</text>
    <text x="16" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">OBC: COLD_STANDBY (P_sw=0.98)</text>
    <text x="16" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Reaction Wheels: 3-of-4 Pyramid</text>
    <text x="16" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">EPS: ACTIVE_PARALLEL (N=2)</text>
    <text x="16" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">TT&amp;C: COLD_STANDBY Transponder</text>
    <text x="16" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Total Series FIT: 3,700 FIT</text>
    <text x="16" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">System MTBF: 30.8 yr (Margin: 10.3×)</text>
    <text x="16" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">SPFs: 0 (ECSS Cl. 6.1 PASS)</text>
    <rect x="16" y="300" width="248" height="26" rx="5" fill="#0ea5e9"/>
    <text x="85" y="317" fill="#020617" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">EXPORT ECSS XML</text>

    <!-- Right Chart Area -->
    <rect x="295" y="0" width="615" height="340" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="312" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">2. SPACECRAFT RELIABILITY DECAY CURVE R(t) &amp; RBD BARS</text>
    <line x1="312" y1="36" x2="895" y2="36" stroke="#1e293b"/>

    <!-- Plot Area -->
    <rect x="315" y="50" width="370" height="210" fill="#070c18" stroke="#1e293b"/>
    <!-- Target line -->
    <line x1="315" y1="120" x2="685" y2="120" stroke="#fbbf24" stroke-dasharray="4 3" stroke-width="1.2"/>
    <text x="320" y="115" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9">Target R = 85.0%</text>
    <!-- Life marker -->
    <line x1="560" y1="50" x2="560" y2="260" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1.2"/>
    <text x="565" y="65" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">Life: 3.0yr</text>
    <!-- Decay curve -->
    <path d="M 320 60 Q 420 70 560 98 T 680 150" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="320" y="250" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">t = 0 yr (100%)</text>
    <text x="530" y="250" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">3.0 yr: 90.12%</text>

    <!-- Right block availability bars -->
    <g transform="translate(705, 50)">
      <text x="0" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">RBD SUBSYSTEMS</text>

      <text x="0" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Dual OBC (99.1% Standby)</text>
      <rect x="0" y="45" width="160" height="8" rx="2" fill="#34d399"/>

      <text x="0" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">3/4 RW Pyramid (98.4%)</text>
      <rect x="0" y="75" width="155" height="8" rx="2" fill="#34d399"/>

      <text x="0" y="100" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Dual EPS Bus (98.9%)</text>
      <rect x="0" y="105" width="158" height="8" rx="2" fill="#34d399"/>

      <text x="0" y="130" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Dual TT&amp;C Transponder (98.2%)</text>
      <rect x="0" y="135" width="153" height="8" rx="2" fill="#34d399"/>

      <text x="0" y="160" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Optical Payload (97.6%)</text>
      <rect x="0" y="165" width="148" height="8" rx="2" fill="#34d399"/>

      <rect x="0" y="185" width="180" height="25" rx="4" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.3)"/>
      <text x="8" y="201" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">OVERALL R: 90.12% (&gt;85%)</text>
    </g>

    <!-- Subcards row -->
    <g transform="translate(315, 270)">
      <rect x="0" y="0" width="180" height="58" rx="6" fill="#090e1c" stroke="#1e293b"/>
      <text x="8" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DESIGN LIFE: 3.0 yr</text>
      <text x="8" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">SURVIVAL R: 90.12%</text>
      <text x="8" y="50" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8">MARGIN: +5.12% PASS</text>

      <rect x="195" y="0" width="180" height="58" rx="6" fill="#090e1c" stroke="#1e293b"/>
      <text x="203" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">TOTAL FIT: 3,700</text>
      <text x="203" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">MTBF: 30.8 yr</text>
      <text x="203" y="50" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8">RATIO: 10.3× LIFE</text>

      <rect x="390" y="0" width="180" height="58" rx="6" fill="#090e1c" stroke="#1e293b"/>
      <text x="398" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">SPFS: 0 (NO HAZARD)</text>
      <text x="398" y="34" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">FDIR COV: 96.0%</text>
      <text x="398" y="50" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8">SCORE: 10/10 PASS</text>
    </g>
  </g>
</svg>
